baseURL = 'https://k-zcw.github.io/'
locale = 'en-us'
title = 'Notes by K'
theme = 'PaperMod'


[params.homeInfoParams]
Title = "Notes by ZCW"
Content = """
<div class="tornado">🌪️</div>
"""

[menu]

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Posts"
url = "/posts/"
weight = 2

[[menu.main]]
name = "About"
url = "/about/"
weight = 3

[taxonomies]
category = "categories"
tag = "tags"

[params]
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowReadingTime = true
ShowShareButtons = false
DateFormat = "2006-01-02 15:04:05"
ShowCodeCopyButtons = true
hideHomePosts = true
ShowSearch = true

[params.editPost]
URL = "https://github.com/K-Zcw/k-zcw.github.io/edit/main/content"
Text = "Edit this post"
appendFilePath = true

[[menu.main]]
name = "Categories"
url = "/categories/"
weight = 4

[[menu.main]]
name = "Archives"
url = "/archives/"
weight = 5

[[menu.main]]
name = "Search"
url = "/search/"
weight = 6

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true