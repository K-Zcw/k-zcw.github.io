<svg width="160" height="160" viewBox="0 0 160 160"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="storm" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#A8BBCB" stop-opacity="0.8"/>
<stop offset="100%" stop-color="#526D82" stop-opacity="0.2"/>
</linearGradient>

</defs>


<!-- 云 -->

<ellipse
cx="80"
cy="35"
rx="45"
ry="18"
fill="#A8BBCB"
opacity="0.25"
/>


<!-- 外旋涡 -->

<path
d="
M25 45
C80 15 145 45 115 80
C90 110 45 85 60 120
"
fill="none"
stroke="url(#storm)"
stroke-width="18"
stroke-linecap="round"
/>


<!-- 内旋涡 -->

<path
d="
M45 60
C85 40 120 60 95 85
C75 105 65 90 75 115
"
fill="none"
stroke="#607D9B"
stroke-width="10"
stroke-linecap="round"
opacity="0.7"
/>


<!-- 风眼 -->

<circle
cx="80"
cy="120"
r="8"
fill="#526D82"
opacity="0.5"
/>


</svg>